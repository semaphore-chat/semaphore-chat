# Electron Builder Configuration
# https://www.electron.build/configuration/configuration

appId: com.semaphorechat.app
productName: Semaphore Chat
copyright: Copyright © 2025

# Custom URL scheme for deep links (semaphore://community/<id>, .../channel/<id>,
# semaphore://direct-messages[/<id>], semaphore://join/<code>). Installers register
# this with the OS: NSIS registry keys on Windows, xdg-mime/.desktop MimeType on
# Linux, CFBundleURLTypes on macOS (see docs-site/docs/installation/desktop-app.md).
# NOTE: the .deb/.rpm/AppImage MimeType registration only takes effect on an
# INSTALLED build, not an unpacked `--dir` build — verify with a real package
# install, not just `electron-builder --dir` (see PR-14 report for the manual QA
# steps: `xdg-open semaphore://...` after installing).
protocols:
  name: Semaphore Chat
  schemes:
    - semaphore

# Directories
directories:
  buildResources: build
  output: release

# Files to include in the build
files:
  - dist/**/*
  - electron/dist/**/*
  - package.json

# Copy the app icon into resources/ for tray and window icons at runtime
extraResources:
  - from: build/icon.png
    to: icon.png

# Auto-update configuration
publish:
  provider: github
  owner: semaphore-chat
  repo: semaphore-chat

# Windows configuration
win:
  target:
    - target: nsis
      arch:
        - x64
  # Self-signing for now (creates temporary certificate)
  # To add proper signing, uncomment and configure:
  # certificateFile: path/to/certificate.pfx
  # certificatePassword: ${env.WINDOWS_CERT_PASSWORD}

# NSIS installer configuration (Windows)
nsis:
  artifactName: Semaphore-Chat-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  # Installer/uninstaller icon
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # License file
  # license: LICENSE.txt

# macOS configuration (for future)
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.social-networking
  # Electron 39+: desktopCapturer (screen share / loopback audio) requires this
  # usage string on macOS >= 14.2
  extendInfo:
    NSAudioCaptureUsageDescription: Semaphore Chat captures system audio when you share your screen with sound.
  # Code signing (requires Apple Developer account)
  # identity: "Developer ID Application: Your Name (TEAM_ID)"
  # hardenedRuntime: true
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

# DMG installer configuration (macOS)
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Linux configuration
#
# NOTE (#349): electron-builder derives the Linux install directory from
# productName, and "/opt/Semaphore Chat/" (with a space) breaks Electron's
# zygote re-exec ("LaunchProcess: failed to execvp: /opt/Semaphore").
# electron-builder (24.x at the time) has no per-platform productName, so EVERY Linux build
# must pass -c.productName=semaphore-chat — see the "electron-builder:linux"
# script in package.json and .github/workflows/electron-build.yml. The
# user-visible name on Linux is unaffected: the launcher entry comes from
# desktop.Name below, and the window title / userData path
# (~/.config/Semaphore Chat) come from the app's own package.json productName.
#
# If you change the install path or executable name, also update
# build/linux/semaphore-chat.apparmor (it hardcodes
# /opt/semaphore-chat/semaphore-chat).
linux:
  executableName: semaphore-chat
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  category: Network
  # electron-builder 26: .desktop keys live under desktop.entry
  desktop:
    entry:
      Name: Semaphore Chat
      GenericName: Voice Chat Application
      Comment: Self-hosted voice and text chat application
      Categories: Network;InstantMessaging;AudioVideo;
      Keywords: chat;voice;video;messaging;

# AppImage configuration
appImage:
  artifactName: Semaphore-Chat-${version}.${ext}
  category: Network

# Debian package configuration
#
# depends mirrors the current electron-builder (>= 25) defaults. The previous
# list included gconf2, gconf-service and libappindicator1, which were removed
# from Debian/Ubuntu in Ubuntu 23.04 and made the .deb uninstallable (#349).
# recommends uses libayatana-appindicator3-1 (tray support) instead of the
# equally-removed libappindicator3-1 default.
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - libayatana-appindicator3-1
  # Custom postinst/postrm: load/unload the AppArmor userns profile required
  # for the Electron sandbox on Ubuntu 23.10+ (#349). These scripts REPLACE
  # electron-builder's default templates, so they also re-implement the default
  # behavior (symlink, SUID chrome-sandbox, desktop/mime db refresh).
  afterInstall: build/linux/deb-after-install.sh
  afterRemove: build/linux/deb-after-remove.sh
  # Ship the AppArmor profile itself (extra fpm mapping: source=dest).
  fpm:
    - build/linux/semaphore-chat.apparmor=/etc/apparmor.d/semaphore-chat

# RPM package configuration
rpm:
  depends:
    - libXScrnSaver
    - libappindicator-gtk3
    - libnotify

# Compression
compression: normal

# Build resources (icons, etc.)
# Place icons in frontend/build/ directory:
# - icon.ico (Windows)
# - icon.icns (macOS)
# - icon.png (Linux, 512x512)
