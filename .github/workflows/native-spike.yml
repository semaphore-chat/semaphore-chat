name: Native Spike

# Checks for the native client spike on its long-lived branch. Not a required check, and
# nothing here runs on main or on PRs. The workflow file only takes effect once the branch
# is pushed, so as of Phase 0 NO JOB HERE HAS RUN, the Windows one included.
on:
  push:
    branches: [main, spike/native-gpui]
    paths:
      - 'native/**'
      # Android has its own workflow (native-android.yml); nothing in this one reads native/android.
      - '!native/android/**'
      - 'scripts/native-baseline/**'
      - '.github/workflows/native-spike.yml'
  pull_request:
    paths:
      - 'native/**'
      # Android has its own workflow (native-android.yml); nothing in this one reads native/android.
      - '!native/android/**'
      - 'scripts/native-baseline/**'
      - '.github/workflows/native-spike.yml'
  workflow_dispatch:

concurrency:
  group: native-spike-${{ github.ref }}
  # Not on main: a cancelled run there saves no cargo cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Caches (#887): the build and NSIS images come from GHCR by their content-hash tag
# (native/scripts/image-cache.sh; a miss builds and, outside fork pull requests, pushes once), and
# the cargo registry is a host directory bind-mounted in place of the Docker volume, restored with
# actions/cache keyed on Cargo.lock and saved by runs on main only. The target directory is not
# cached: it is tens of GB, more than the repository's whole cache allowance.
env:
  NATIVE_IMAGE_REGISTRY: ghcr.io/semaphore-chat
  # Fork pull requests pull only; every other run pushes an image it had to build.
  NATIVE_IMAGE_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
  # TEMPORARY (#887 proof): also this branch's pull request; removed before review.
  NATIVE_CACHE_SAVE: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/native-image-cache' }}

jobs:
  checks:
    name: Build, policy and headless render (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # 60 minutes was enough for verify.sh; the native UI review below renders every story three
    # times (about 80 CPU-minutes, so roughly 20 on the runner's 4 cores) on pull requests. A change
    # that touches every story (a theme change, as in #863) also writes a composite for every shot:
    # that compare alone ran past 35 minutes, so 180 leaves room for it.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # release-notes.sh lists the commits that touched native/ since the previous native-v*
          # tag, and under test-release-assembly.sh below: a shallow checkout has only the pull
          # request's merge commit, whose changes --no-merges leaves out.
          fetch-depth: 0
          persist-credentials: false
      - name: Image cache helper
        run: native/scripts/test-image-cache.sh
      # actions/cache refuses paths with `..`, and a job's env can't read the runner context, so
      # the cache directory under the runner's temp directory is set here.
      - name: Point the caches at the runner's temp directory
        run: |
          echo "NATIVE_CARGO_CACHE=$RUNNER_TEMP/native-cache/cargo" >> "$GITHUB_ENV"
      - name: Log in to GHCR (the native image cache)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Restore the cargo registry
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.NATIVE_CARGO_CACHE }}/registry/index
            ${{ env.NATIVE_CARGO_CACHE }}/registry/cache
            ${{ env.NATIVE_CARGO_CACHE }}/git/db
          key: native-cargo-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-cargo-
      # The release and packaging scripts, which nothing else runs before a native-v* tag goes
      # out: assembly and the manifest checks with a throwaway key, and the installer compiled in
      # the NSIS image (native/docker/Dockerfile.nsis). First, so a break here shows up in
      # minutes rather than after the build and render steps below.
      - name: Release assembly, signing and manifests
        run: native/scripts/in-image.sh scripts/test-release-assembly.sh
      - name: Windows installer compiles and unpacks
        run: native/scripts/test-package-windows.sh
      # Same pinned image and the same script as local runs.
      - name: Verify
        run: native/scripts/verify.sh
        env:
          RESULT_SCHEMA_HOST: ${{ github.workspace }}/scripts/native-baseline/result.schema.json
      # Right after Verify, which has fetched every crate the workspace builds.
      - name: Save the cargo registry
        if: ${{ !cancelled() && env.NATIVE_CACHE_SAVE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.NATIVE_CARGO_CACHE }}/registry/index
            ${{ env.NATIVE_CARGO_CACHE }}/registry/cache
            ${{ env.NATIVE_CARGO_CACHE }}/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # Before/after renders of every story against the pull request's base, the same script and
      # image as a local run (which the Verify step above has already built rig-shot for). Visual
      # changes do not fail this: the report is the review. A story that won't render does.
      # Docs: docs-site/docs/contributing/native-ui-review.md
      # Only when the pull request touches something that can change what the desktop app draws
      # (native/scripts/ui-review-needed.sh holds the list); pushes and manual runs always render.
      - name: Does the native UI review need to run?
        id: ui-review-needed
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # fetch-depth: 0 above, so origin/$BASE_REF is already here.
          decision="$(git diff --name-only "origin/$BASE_REF"...HEAD | native/scripts/ui-review-needed.sh)"
          if [ "$decision" = "run" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Native UI review skipped: no rendering paths changed (see native/scripts/ui-review-needed.sh for the list)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Native UI review (before/after story renders)
        if: github.event_name == 'pull_request' && steps.ui-review-needed.outputs.run == 'true'
        env:
          UI_REVIEW_SHARDS: 4
        run: |
          set +e
          native/scripts/ui-review.sh --base "${{ github.event.pull_request.base.sha }}"
          status=$?
          if [ -f native/.ui-review/out/pr-block.md ]; then
            cat native/.ui-review/out/pr-block.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request' && steps.ui-review-needed.outputs.run == 'true'
        with:
          name: native-ui-review
          path: native/.ui-review/out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-results
          path: native/results/

  core-mobile:
    name: semaphore-core on Android and iOS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Deliberately outside the image and with no NDK or Xcode: rustup's targets alone must
      # be enough. If core gains a C build this fails, as the boundary check does.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check Android
        run: cargo check --locked -p semaphore-core --target aarch64-linux-android
      - name: Check iOS
        run: cargo check --locked -p semaphore-core --target aarch64-apple-ios

  windows-link:
    name: Link the desktop app (Windows)
    # UNTESTED until the branch is pushed. libwebrtc plus GPUI has never been linked on MSVC.
    # Hosted runners have no GPU, so this proves build and link only, nothing about rendering.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # gpui-pre-windows is our patched copy, so the release build below compiles the video
      # surface shader with fxc and links our D3D11 path. Fail clearly if that stops being true.
      - name: Check the build uses the vendored renderer
        shell: bash
        run: |
          for crate in gpui-pre gpui-pre-windows; do
            package="$(cargo tree --locked -p semaphore-app --target x86_64-pc-windows-msvc \
              -e normal -i "$crate" --depth 0 --format '{p}')"
            echo "$package"
            echo "$package" | grep -q 'third_party[/\\]vendor[/\\]' \
              || { echo "$crate isn't the vendored copy"; exit 1; }
          done
      - name: Check fxc.exe is available
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found: gpui-pre-windows compiles its shaders with it in release' }
          $fxc.FullName
      # Failures also go out as annotations, which can be read without a login, unlike job logs.
      - name: Build
        shell: bash
        run: |
          set +e
          cargo build --locked --release -p semaphore-app 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -nE '^error|error(\[|:)|fatal error|LNK[0-9]+|failed to run custom build' build.log \
              | head -8 | cut -c1-900 | sed 's/^/::error title=Windows build::/'
            echo "::error title=Windows build tail::$(tail -n 40 build.log | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 3500)"
          fi
          exit "$rc"
      # Runs the D3D11 video surface on whatever the hosted runner has. At best that's WARP, which is
      # software rendering: a pass proves the code, not a GPU. No device is reported, never passed.
      - name: Video surface smoke test (software rendering at best)
        shell: bash
        run: |
          set +e
          cargo build --locked --release -p rig-surface-smoke || exit 1
          out="$(timeout 300 target/release/rig-surface-smoke 2>&1)"
          rc=$?
          echo "$out"
          line="$(echo "$out" | grep '^SURFACE_SMOKE' | tail -n 1)"
          case "$rc" in
            0)
              # The rig calls WARP ("Microsoft Basic Render Driver", 0x1414:0x8c) software by its
              # adapter ids as well as by DXGI's software flag, which WARP doesn't set.
              if echo "$line" | grep -q 'software=true'; then
                label="a software renderer (WARP), so NOT proof that a GPU draws it"
              elif echo "$line" | grep -q 'software=false'; then
                label="a hardware adapter (neither DXGI's software flag nor WARP's ids)"
              else
                label="an adapter of unknown kind, so NOT proof that a GPU draws it"
              fi
              echo "::notice title=Video surface smoke::Passed on $label: $line"
              echo "Video surface smoke test passed on $label: \`$line\`" >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              echo "::warning title=Video surface NOT TESTED::No D3D11 device, window or uploader here, so the surface path did not run: $line"
              echo "Video surface smoke test: **NOT TESTED**, no D3D11 device, window or uploader: \`$line\`" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=Video surface smoke::exit $rc: ${line:-no result line}"
              exit "$rc"
              ;;
          esac
      - name: Report the binary size
        shell: bash
        run: ls -l target/release/semaphore-app.exe
      - uses: actions/upload-artifact@v7
        with:
          name: semaphore-app-windows
          path: native/target/release/semaphore-app.exe
          if-no-files-found: error
      # T11: system audio by WASAPI process loopback. Built here, run by hand on a real machine
      # (scripts/desk/t11-sysaudio-windows.ps1); a hosted runner has no audio device.
      - name: Build the T11 system audio rig
        shell: bash
        run: cargo build --locked --release -p rig-sysaudio
      - uses: actions/upload-artifact@v7
        with:
          name: rig-sysaudio-windows
          path: |
            native/target/release/rig-sysaudio.exe
            native/scripts/desk/t11-sysaudio-windows.ps1
          if-no-files-found: error
      # The capture shim: libwebrtc's screen capturers (WGC, DXGI) and its DirectShow camera
      # module, through our patched webrtc-sys. Building it compiles the shim's C++ for MSVC,
      # which the Linux image can't. The run is informational: a hosted runner may have no
      # capturable desktop and has no camera, so it can't fail the job.
      - name: Build the capture probe
        shell: bash
        run: cargo build --locked --release -p semaphore-media-livekit --example capture_probe
      - name: Capture probe (informational)
        shell: bash
        continue-on-error: true
        run: |
          target/release/examples/capture_probe screens --fps 15 --frames 10 || true
          target/release/examples/capture_probe cameras --frames 10 || true
      - uses: actions/upload-artifact@v7
        with:
          name: capture-probe-windows
          path: native/target/release/examples/capture_probe.exe
          if-no-files-found: error
      # W3-player spike: the shim against webrtc.lib's FFmpeg, whose symbols keep their plain names
      # on Windows (Linux has LiveKit's LK_ prefix), libvpx and dav1d, on the committed fixtures.
      # The Linux image can't build this C for MSVC, so this is its only Windows proof.
      - name: Player fixtures decode (FFmpeg, libvpx, dav1d in libwebrtc)
        shell: bash
        run: |
          # AAC is on by default now; the second run is the same tests without it (refusals).
          cargo test --locked --release -p semaphore-player
          cargo test --locked --release -p semaphore-player --no-default-features
      # For a real Windows GPU: the hosted runner only has the software adapter.
      - uses: actions/upload-artifact@v7
        with:
          name: rig-surface-smoke-windows
          path: native/target/release/rig-surface-smoke.exe
          if-no-files-found: error
