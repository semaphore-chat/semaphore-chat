name: Native Spike

# Checks for the native client spike on its long-lived branch. Not a required check, and
# nothing here runs on main or on PRs. The workflow file only takes effect once the branch
# is pushed, so as of Phase 0 NO JOB HERE HAS RUN, the Windows one included.
on:
  push:
    branches: [spike/native-gpui]
    paths:
      - 'native/**'
      - '.github/workflows/native-spike.yml'
  workflow_dispatch:

concurrency:
  group: native-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build, policy and headless render (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Same pinned image and the same script as local runs.
      - name: Verify
        run: native/scripts/verify.sh
        env:
          RESULT_SCHEMA_HOST: ${{ github.workspace }}/scripts/native-baseline/result.schema.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-results
          path: native/results/

  core-mobile:
    name: semaphore-core on Android and iOS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      # Deliberately outside the image and with no NDK or Xcode: rustup's targets alone must
      # be enough. If core gains a C build this fails, as the boundary check does.
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Check Android
        run: cargo check --locked -p semaphore-core --target aarch64-linux-android
      - name: Check iOS
        run: cargo check --locked -p semaphore-core --target aarch64-apple-ios

  windows-link:
    name: Link the desktop app (Windows)
    # UNTESTED until the branch is pushed. libwebrtc plus GPUI has never been linked on MSVC.
    # Hosted runners have no GPU, so this proves build and link only, nothing about rendering.
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # gpui-pre-windows is our patched copy, so the release build below compiles the video
      # surface shader with fxc and links our D3D11 path. Fail clearly if that stops being true.
      - name: Check the build uses the vendored renderer
        shell: bash
        run: |
          for crate in gpui-pre gpui-pre-windows; do
            package="$(cargo tree --locked -p semaphore-app --target x86_64-pc-windows-msvc \
              -e normal -i "$crate" --depth 0 --format '{p}')"
            echo "$package"
            echo "$package" | grep -q 'third_party[/\\]vendor[/\\]' \
              || { echo "$crate isn't the vendored copy"; exit 1; }
          done
      - name: Check fxc.exe is available
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe not found: gpui-pre-windows compiles its shaders with it in release' }
          $fxc.FullName
      # Failures also go out as annotations, which can be read without a login, unlike job logs.
      - name: Build
        shell: bash
        run: |
          set +e
          cargo build --locked --release -p semaphore-app 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -nE '^error|error(\[|:)|fatal error|LNK[0-9]+|failed to run custom build' build.log \
              | head -8 | cut -c1-900 | sed 's/^/::error title=Windows build::/'
            echo "::error title=Windows build tail::$(tail -n 40 build.log | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | tail -c 3500)"
          fi
          exit "$rc"
      - name: Report the binary size
        shell: bash
        run: ls -l target/release/semaphore-app.exe
      - uses: actions/upload-artifact@v7
        with:
          name: semaphore-app-windows
          path: native/target/release/semaphore-app.exe
          if-no-files-found: error
