name: Native end to end

# The headless end-to-end suite (`native/scripts/slice-e2e.sh`: the real app on lavapipe twice
# against the fake server, every run compared shot for shot). It takes about 13 minutes locally,
# which is too slow for every pull request, so it runs nightly and on dispatch only. The pull
# request gates stay in native-spike.yml (build, policy, headless render).
on:
  schedule:
    # 03:00 UTC, before the working day in Europe; the schedule only exists on the default branch.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: native-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The build image is pulled from GHCR by its content-hash tag (native/scripts/image-cache.sh,
  # #887), with no login; a miss builds it locally. Only native-images.yml pushes it.
  NATIVE_IMAGE_REGISTRY: ghcr.io/semaphore-chat
  
jobs:
  slice-e2e:
    name: Headless end to end (fake server, lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same runner, same pinned image and the same script a local run uses: the step is
    # `scripts/in-image.sh scripts/slice-e2e.sh`, which builds or reuses the image on
    # `semaphore-test`. The suite needs the image (Arch's glib2, lavapipe, clang/lld from the
    # pinned snapshot); on the bare runner the .cargo/config.toml link args find no glib and the
    # run is not the deterministic one the shot comparison expects. The cargo registry is restored
    # from the copy native-spike.yml saves on main; the target directory is not cached.
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      # actions/cache refuses paths with `..`, and a job's env can't read the runner context, so
      # the cache directory under the runner's temp directory is set here.
      - name: Point the caches at the runner's temp directory
        run: |
          echo "NATIVE_CARGO_CACHE=$RUNNER_TEMP/native-cache/cargo" >> "$GITHUB_ENV"
      - name: Restore the cargo registry
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.NATIVE_CARGO_CACHE }}/registry/index
            ${{ env.NATIVE_CARGO_CACHE }}/registry/cache
            ${{ env.NATIVE_CARGO_CACHE }}/git/db
          key: native-cargo-desktop-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: native-cargo-desktop-
      - name: Run the default suite
        run: scripts/in-image.sh scripts/slice-e2e.sh
      # The rig's own log, the steps, the fake server's log and the shots: what a failing run
      # needs, including the first of the two runs' images.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: native-e2e-results
          path: native/results/slice/
          if-no-files-found: ignore
