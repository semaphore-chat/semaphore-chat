name: Native Android

# The debug APK: native/scripts/android.sh builds the Android image (JDK, SDK, NDK, Gradle,
# cargo-ndk and uniffi-bindgen), builds semaphore-mobile for aarch64-linux-android, generates the
# Kotlin bindings, checks the library exports what they call, runs the JVM test of the bindings
# against semaphore-fake-server and runs ./gradlew assembleDebug. Artifact only: this workflow
# creates no release, pushes no tag and publishes nothing.
#
# A second job runs the instrumented test on an x86_64 emulator
# (native/scripts/android-device-test.sh). It has been run on this host's Docker and /dev/kvm, but
# not on a GitHub runner: the first CI run is what proves the KVM rule below on that image.
#
# Caches (#887): the images come from GHCR by their content-hash tag (native/scripts/image-cache.sh;
# a miss builds and, outside fork pull requests, pushes once). Gradle's downloaded dependencies and
# the cargo registry are host directories bind-mounted in place of the Docker volumes, restored
# with actions/cache keyed on the Gradle build files and Cargo.lock. Only runs on main save them,
# so pull requests share main's copy and add none of their own; the push trigger is what writes it.
on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'design/fonts/**'
      - 'design/vectors/**'
      - 'design/tokens.json'
      - '.github/workflows/native-android.yml'
  pull_request:
    paths:
      - 'native/**'
      # The kit's fonts and the palette vectors its stories render with.
      - 'design/fonts/**'
      - 'design/vectors/**'
      - 'design/tokens.json'
      - '.github/workflows/native-android.yml'
  workflow_dispatch:

concurrency:
  group: native-android-${{ github.ref }}
  # Not on main: a cancelled run there saves no cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NATIVE_IMAGE_REGISTRY: ghcr.io/semaphore-chat
  # Fork pull requests pull only; every other run pushes an image it had to build.
  NATIVE_IMAGE_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
  # Saves happen on main only (see the top of the file).
  # TEMPORARY (#887 proof): also this branch's pull request; removed before review.
  NATIVE_CACHE_SAVE: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/native-image-cache' }}

jobs:
  debug-apk:
    name: Build the debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    # The image build (SDK, NDK, a Gradle distribution) dominates a run that misses the registry.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actions/cache refuses paths with `..`, and a job's env can't read the runner context, so
      # the cache directories under the runner's temp directory are set here.
      - name: Point the caches at the runner's temp directory
        run: |
          echo "NATIVE_CARGO_CACHE=$RUNNER_TEMP/native-cache/cargo" >> "$GITHUB_ENV"
          echo "NATIVE_GRADLE_CACHE=$RUNNER_TEMP/native-cache/gradle" >> "$GITHUB_ENV"
      - name: Log in to GHCR (the native image cache)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Restore the Gradle dependency cache
        id: gradle-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.NATIVE_GRADLE_CACHE }}/caches/modules-2
            ${{ env.NATIVE_GRADLE_CACHE }}/wrapper/dists
          key: native-gradle-${{ hashFiles('native/android/**/*.gradle.kts', 'native/android/gradle.properties', 'native/android/gradle/wrapper/gradle-wrapper.properties', 'native/docker/Dockerfile.android') }}
          restore-keys: native-gradle-
      - name: Restore the cargo registry
        id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.NATIVE_CARGO_CACHE }}/registry/index
            ${{ env.NATIVE_CARGO_CACHE }}/registry/cache
            ${{ env.NATIVE_CARGO_CACHE }}/git/db
          key: native-cargo-android-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            native-cargo-android-
            native-cargo-
      - name: Build the APK
        run: scripts/android.sh
      # Gradle's lock and GC bookkeeping files are rewritten every run and are not worth caching.
      - name: Tidy the Gradle cache for saving
        if: ${{ !cancelled() && env.NATIVE_CACHE_SAVE == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        run: |
          find "$NATIVE_GRADLE_CACHE/caches/modules-2" -name '*.lock' -delete 2>/dev/null || true
          rm -f "$NATIVE_GRADLE_CACHE/caches/modules-2/gc.properties"
      - name: Save the Gradle dependency cache
        if: ${{ !cancelled() && env.NATIVE_CACHE_SAVE == 'true' && steps.gradle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.NATIVE_GRADLE_CACHE }}/caches/modules-2
            ${{ env.NATIVE_GRADLE_CACHE }}/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Save the cargo registry
        if: ${{ !cancelled() && env.NATIVE_CACHE_SAVE == 'true' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.NATIVE_CARGO_CACHE }}/registry/index
            ${{ env.NATIVE_CARGO_CACHE }}/registry/cache
            ${{ env.NATIVE_CARGO_CACHE }}/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # The APK, plus the .so files and dex class list android.sh prints, in the run log.
      - uses: actions/upload-artifact@v7
        with:
          name: semaphore-android-debug
          path: native/android/out/semaphore-android-debug.apk
          if-no-files-found: error
          retention-days: 14

  # The instrumented test on the x86_64 emulator: NativeLib's TLS initialisation,
  # KeystoreSecretStore against the Android Keystore, and the core signing in, hearing a live
  # message and restoring its session against semaphore-fake-server, all on the device.
  # native/scripts/android-device-test.sh builds the emulator image, boots the emulator headless in
  # a container and runs ./gradlew connectedDebugAndroidTest.
  #
  # KVM: GitHub's Linux runners do expose /dev/kvm, but only to root until the udev rule below
  # widens the device node's mode. The rule is the one ReactiveCircus/android-emulator-runner's
  # README documents for hardware-accelerated emulators on Linux runners; without it the emulator
  # falls back to software emulation and the boot times out.
  device-test:
    name: Instrumented test on the x86_64 emulator
    runs-on: ubuntu-latest
    # The emulator image (a ~350 MB emulator and a ~1 GB system image) dominates a run that misses
    # the registry; the emulator build and boot come on top of the APK's build.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # actions/cache refuses paths with `..`, and a job's env can't read the runner context, so
      # the cache directories under the runner's temp directory are set here.
      - name: Point the caches at the runner's temp directory
        run: |
          echo "NATIVE_CARGO_CACHE=$RUNNER_TEMP/native-cache/cargo" >> "$GITHUB_ENV"
          echo "NATIVE_GRADLE_CACHE=$RUNNER_TEMP/native-cache/gradle" >> "$GITHUB_ENV"
      - name: Log in to GHCR (the native image cache)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Restore only: debug-apk saves both, and the instrumented test needs few dependencies more.
      - name: Restore the Gradle dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.NATIVE_GRADLE_CACHE }}/caches/modules-2
            ${{ env.NATIVE_GRADLE_CACHE }}/wrapper/dists
          key: native-gradle-${{ hashFiles('native/android/**/*.gradle.kts', 'native/android/gradle.properties', 'native/android/gradle/wrapper/gradle-wrapper.properties', 'native/docker/Dockerfile.android') }}
          restore-keys: native-gradle-
      - name: Restore the cargo registry
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.NATIVE_CARGO_CACHE }}/registry/index
            ${{ env.NATIVE_CARGO_CACHE }}/registry/cache
            ${{ env.NATIVE_CARGO_CACHE }}/git/db
          key: native-cargo-android-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            native-cargo-android-
            native-cargo-
      - name: Make /dev/kvm usable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run the instrumented test
        run: scripts/android-device-test.sh
      # The per-test results and the device's logcat, when something fails.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semaphore-android-device-test-results
          path: |
            native/android/app/build/outputs/androidTest-results
            native/android/app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 14
