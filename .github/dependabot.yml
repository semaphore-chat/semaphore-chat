version: 2

# Notes (2026-09 backlog cleanup):
# - The repo is ONE pnpm workspace (shared/, backend/, frontend/) with a single
#   root pnpm-lock.yaml, so npm updates run from "/". The old /backend and
#   /frontend entries predate the workspace and produced package-lock.json PRs.
# - Security updates are grouped too (applies-to: security-updates), so an
#   advisory wave becomes one PR instead of one job per package.
# - Majors are never grouped: each gets its own PR for a changelog review.
updates:
  # npm: the whole pnpm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Must be >= pnpm's minimumReleaseAge (3 days, pnpm-workspace.yaml).
    # Dependabot doesn't read that setting (dependabot-core#13405), so without
    # a cooldown it proposes releases under 3 days old and pnpm rejects them
    # (ERR_PNPM_NO_MATURE_MATCHING_VERSION), failing the whole group for the
    # week. 4 days leaves a day of margin. Security updates skip this cooldown
    # but pnpm still holds them until they are 3 days old.
    cooldown:
      default-days: 4
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Docker base images. node stays on the active LTS line (24); its majors
  # (e.g. non-LTS 25) are ignored. nginx/alpine minor and patch bumps flow through.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Docs site (MkDocs)
  - package-ecosystem: "pip"
    directory: "/docs-site"
    schedule:
      interval: "monthly"
    groups:
      docs:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "documentation"
