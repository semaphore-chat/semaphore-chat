site_name: Semaphore Chat Docs
site_url: https://docs.semaphorechat.app
site_description: Documentation for Semaphore Chat — self-hosted voice and text chat
repo_url: https://github.com/semaphore-chat/semaphore-chat
repo_name: semaphore-chat/semaphore-chat
edit_uri: edit/main/docs-site/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Tour: tour.md
  - Installation:
      - Docker Compose: installation/docker-compose.md
      - Kubernetes: installation/kubernetes.md
      - Desktop App: installation/desktop-app.md
      - Configuration: installation/configuration.md
      - First Run: installation/first-run.md
  - Architecture:
      - Overview: architecture/overview.md
      - Backend: architecture/backend.md
      - Frontend: architecture/frontend.md
      - Database Schema: architecture/database.md
      - WebSocket Patterns: architecture/websocket-patterns.md
      - Replay Buffer: architecture/replay-buffer.md
  - Operations:
      - Release Process: operations/release-process.md
      - WebSocket Troubleshooting: operations/websocket-troubleshooting.md
  - Contributing:
      - Overview: contributing/index.md
      - Development Setup: contributing/development-setup.md
      - Testing Guide: contributing/testing.md
      - UI Review Screenshots: contributing/ui-review.md
      - Code Patterns: contributing/code-patterns.md
      - Regenerating Screenshots: contributing/regenerating-screenshots.md
  - Security: security.md
  - License: license.md

extra_css:
  - stylesheets/tour.css

plugins:
  - search
  - minify:
      minify_html: true
  # Lightbox + swipe for the Tour gallery (images are grouped by `data-gallery`).
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/semaphore-chat/semaphore-chat

copyright: Copyright &copy; 2025-2026 Semaphore Chat
