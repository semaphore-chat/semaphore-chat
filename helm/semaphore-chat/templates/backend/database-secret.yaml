{{- if include "semaphore-chat.database.chartSecret" . }}
# DATABASE_URL holds the database password, so it lives in a Secret, not the
# backend ConfigMap. A hook, so it exists before the pre-install/pre-upgrade
# migration Job runs (normal resources are created after the hooks). Helm
# doesn't delete hook resources on uninstall: remove it by hand then.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "semaphore-chat.fullname" . }}-database
  labels:
    {{- include "semaphore-chat.backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ include "semaphore-chat.postgresql.uri" . | quote }}
{{- end }}
