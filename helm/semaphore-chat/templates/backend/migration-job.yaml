{{- if .Values.backend.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "semaphore-chat.fullname" . }}-backend-migrate
  labels:
    {{- include "semaphore-chat.backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "semaphore-chat.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "semaphore-chat.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "semaphore-chat.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: {{ include "semaphore-chat.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["/app/node_modules/.bin/prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
          # `prisma migrate deploy` needs only DATABASE_URL, from a hook Secret
          # (or a pre-created one): the chart's ConfigMap and other Secrets
          # don't exist yet when this pre-install hook runs.
          env:
            - name: SKIP_PRISMA_MIGRATE
              value: "true"
            {{- include "semaphore-chat.database.env" . | nindent 12 }}
{{- end }}
