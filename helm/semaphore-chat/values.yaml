# Default values for semaphore-chat
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ============================================
# Global Settings
# ============================================
global:
  # Image registry override (leave empty to use default)
  imageRegistry: ""
  # Image pull secrets for private registries
  imagePullSecrets: []

# ============================================
# Backend Configuration
# ============================================
backend:
  # Number of backend replicas
  # NOTE: keep this at 1 unless fileStorage.enabled=true with a ReadWriteMany-capable
  # storage backend (e.g. NFS). With ephemeral storage, uploads on one pod 404 on the
  # others and are lost on restart. A template guard enforces this at render time.
  replicaCount: 1

  image:
    repository: ghcr.io/user/semaphore-backend
    pullPolicy: Always
    tag: "latest"

  # Trust proxy setting for Express (required behind ingress/load balancer).
  # Number of proxy hops in front of the backend, a subnet, or a specific IP.
  # The ingress controller routes /api and /socket.io straight to the backend
  # (ClusterIP), so it is one hop. Count a proxy in front of the ingress (e.g. a
  # CDN) only if the ingress passes its X-Forwarded-For through (ingress-nginx
  # does not by default). Never set it higher than the real count or to "true":
  # clients could spoof their IP. Empty = no proxy trusted (TRUST_PROXY unset).
  # See: https://expressjs.com/en/guide/behind-proxies.html
  trustProxy: "1"

  # Database migrations (runs as a Helm pre-install/pre-upgrade hook Job)
  migrations:
    enabled: true  # Set false to manage migrations externally

  # Service configuration
  service:
    type: ClusterIP
    port: 3000
    annotations: {}

  # Resource limits and requests
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 40
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Node selector for pod assignment
  nodeSelector: {}

  # Tolerations for pod assignment
  tolerations: []

  # Affinity for pod assignment
  affinity: {}

  # Extra environment variables for the backend container.
  # Use for optional features not covered by first-class values
  # (e.g. GIPHY_API_KEY, SMTP_* for password-reset email, JOB_WORKER_CONCURRENCY).
  # Supports the full k8s EnvVar schema, so secrets can use valueFrom.secretKeyRef.
  # Example:
  #   extraEnv:
  #     - name: GIPHY_API_KEY
  #       valueFrom:
  #         secretKeyRef:
  #           name: my-giphy-secret
  #           key: GIPHY_API_KEY
  #     - name: JOB_WORKER_CONCURRENCY
  #       value: "4"
  extraEnv: []

  # Pod annotations
  podAnnotations: {}

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

# ============================================
# Frontend Configuration
# ============================================
frontend:
  # Number of frontend replicas
  replicaCount: 2

  image:
    repository: ghcr.io/user/semaphore-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  # Service configuration
  service:
    type: ClusterIP
    port: 5173
    annotations: {}

  # Resource limits and requests
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  # Liveness and readiness probes
  livenessProbe:
    httpGet:
      path: /health
      port: 5173
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /health
      port: 5173
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

  # Environment variables for nginx
  env:
    # Backend URL (internal service URL)
    backendUrl: "http://semaphore-backend:3000"

  # Extra environment variables for the frontend container
  # These are injected at runtime (useful for feature flags, etc.)
  # Example:
  #   extraEnv:
  #     - name: VITE_APP_VERSION
  #       value: "1.2.3"
  extraEnv: []

  # Node selector for pod assignment
  nodeSelector: {}

  # Tolerations for pod assignment
  tolerations: []

  # Affinity for pod assignment
  affinity: {}

  # Pod annotations
  podAnnotations: {}

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101  # nginx user
    fsGroup: 101

  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

# ============================================
# Ingress Configuration
# ============================================
ingress:
  enabled: true
  className: "nginx"
  annotations:
    # WebSocket support - Long timeouts for persistent connections
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    # File upload size
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # WebSocket upgrade headers for Socket.IO and LiveKit
    nginx.ingress.kubernetes.io/websocket-services: "semaphore-backend"
    # Cookie-based sticky sessions (required for multi-replica Socket.IO)
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "semaphore-affinity"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    # Additional annotations for your use case
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

  hosts:
    - host: semaphore.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /socket.io
          pathType: Prefix
          service: backend

  # TLS configuration
  tls:
    # Options: "none", "cert-manager", "manual"
    mode: "none"

    # For cert-manager mode
    certManager:
      enabled: false
      issuer: "letsencrypt-prod"
      issuerKind: "ClusterIssuer"

    # For manual mode - reference to existing secret
    secretName: ""

# ============================================
# PostgreSQL Configuration
# ============================================
postgresql:
  # Set to true to deploy PostgreSQL as part of this chart
  bundled: true

  auth:
    username: semaphore
    password: ""  # Set via --set or secrets
    database: semaphore

  primary:
    persistence:
      enabled: true
      size: 10Gi

    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  # External PostgreSQL (when bundled is false)
  external:
    uri: ""  # e.g., postgresql://user:pass@host:5432/semaphore

# ============================================
# Redis Configuration
# ============================================
redis:
  # Set to true to deploy Redis as part of this chart
  # Set to false to use external Redis
  bundled: true

  # Architecture: standalone or replication
  architecture: standalone

  # Authentication
  auth:
    enabled: true
    password: "changeme-redis-password"

  # Persistence and resources for the bundled Redis master
  master:
    persistence:
      enabled: true
      size: 8Gi
      # storageClass: ""

    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # External Redis configuration (when bundled: false)
  external:
    host: "redis.example.com"
    port: 6379
    password: ""

# ============================================
# LiveKit Configuration (External Only)
# ============================================
livekit:
  # LiveKit server URL (WebSocket endpoint)
  url: "wss://livekit.example.com"

  # LiveKit API credentials
  apiKey: "your-livekit-api-key"
  apiSecret: "your-livekit-api-secret"

  # Webhook secret for verifying LiveKit webhook signatures
  # Generate with: openssl rand -hex 32
  webhookSecret: "your-livekit-webhook-secret"

# ============================================
# Application Secrets
# ============================================
secrets:
  # JWT secrets for authentication
  jwtSecret: "CHANGE-ME-long-random-secret-for-jwt-signing"
  jwtRefreshSecret: "CHANGE-ME-different-long-random-secret-for-refresh-tokens"

  # Create secrets from existing Kubernetes secret
  # If true, the above values are ignored and you must create a secret manually
  existingSecret: ""

# ============================================
# Service Account
# ============================================
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# ============================================
# Pod Disruption Budget
# ============================================
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ============================================
# Network Policies
# ============================================
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress

# ============================================
# Metrics (Prometheus)
# ============================================
metrics:
  # Expose Prometheus metrics on the backend at /api/metrics
  # (sets METRICS_ENABLED=true in the backend container)
  #
  # WARNING: the endpoint is unauthenticated and /api is routed through the
  # public ingress, so enabling this exposes process stats, the route
  # inventory and per-route traffic patterns to anyone who can reach the
  # ingress. In-cluster ServiceMonitor scraping does not need external
  # exposure — if your ingress is public, restrict /api/metrics there (e.g.
  # nginx.ingress.kubernetes.io/whitelist-source-range or a deny rule).
  enabled: false

  # Prometheus Operator ServiceMonitor for the backend service
  # Requires the ServiceMonitor CRD (kube-prometheus-stack) to be installed
  serviceMonitor:
    enabled: false
    # Scrape interval
    interval: 30s

# ============================================
# File Storage Configuration
# ============================================
fileStorage:
  # Enable persistent file storage for uploads
  # Set to false to use ephemeral storage (files lost on pod restart, and not
  # shared between replicas). Defaults to true so a fresh install doesn't
  # silently lose uploaded files. The uploads PVC accessMode is chosen
  # automatically (see accessMode below): ReadWriteOnce at
  # backend.replicaCount=1 (the default, works with any storage class,
  # including EBS/GCP PD/Azure Disk/local-path), and ReadWriteMany once you
  # scale to more than one backend pod — which requires an RWX-capable
  # backend (e.g. NFS, EFS, AzureFile).
  enabled: true

  # Storage size
  size: 100Gi

  # Storage class name. Leave empty ("") to use the cluster's default
  # StorageClass for dynamic provisioning. If using a non-default
  # StorageClass, specify its name here.
  # NOTE: when fileStorage.nfs.enabled=true, the PVC always renders an
  # explicit storageClassName: "" regardless of this setting — that's
  # required for static binding to the chart-managed NFS PersistentVolume,
  # not "no storage class" and not the cluster default.
  storageClassName: ""

  # PVC access mode for the uploads volume. Leave empty ("") for automatic
  # selection: ReadWriteOnce when the backend can only ever run 1 pod
  # (backend.replicaCount=1 and autoscaling disabled, or autoscaling
  # maxReplicas=1), ReadWriteMany otherwise. Set explicitly to
  # "ReadWriteOnce" or "ReadWriteMany" to override auto-detection.
  #
  # NOTE: PVC accessModes are immutable in Kubernetes. If you're upgrading an
  # existing release whose PVC was already created as ReadWriteMany, either
  # keep this set to "ReadWriteMany" explicitly or delete/recreate the PVC —
  # do not rely on auto-detection silently changing the mode underneath you.
  accessMode: ""

  # NFS-specific configuration
  # To use NFS, set nfs.enabled: true and provide your NFS server details
  nfs:
    enabled: false
    # NFS server IP or hostname (override with your NFS server)
    server: "nfs-server.example.com"
    # NFS export path (override with your NFS export path)
    path: "/exports/semaphore-uploads"

  # Escape hatch: set to true to allow backend.replicaCount > 1 (or
  # autoscaling enabled with maxReplicas > 1 — the guard checks the highest
  # POTENTIAL replica count the backend could ever reach, not minReplicas)
  # together with fileStorage.enabled=false. Off by default — this
  # combination silently loses uploaded files, so the chart refuses to
  # render unless you explicitly acknowledge the risk here.
  allowEphemeral: false

  # Mount options for NFS volumes (optional)
  # If not specified, default NFSv4.1 resilient options are used
  # Set to empty array [] to use NFSv3 defaults without any custom options
  # Example custom options: ["nfsvers=4.1", "hard", "tcp"]
  # mountOptions: []

  # S3-compatible object storage for uploads (avatars, attachments). When
  # enabled, sets STORAGE_TYPE=S3 on the backend so new uploads write
  # directly to the bucket instead of the local uploads PVC — this removes
  # the RWX/NFS requirement for multi-replica deployments entirely (see
  # semaphore-chat.validateFileStorage in _helpers.tpl).
  #
  # If fileStorage.enabled is ALSO true, the uploads PVC still gets created
  # and mounted — that's "mixed mode": files uploaded before switching to S3
  # (STORAGE_TYPE=LOCAL) remain on the PVC and are served from there, so the
  # PVC's accessMode/RWX requirements still apply to it at >1 backend
  # replicas. Once no LOCAL-storage files remain, set fileStorage.enabled to
  # false to drop the PVC requirement completely.
  s3:
    # Set true to use S3 (or an S3-compatible provider) for file uploads.
    enabled: false

    # S3 bucket name. Required when s3.enabled=true.
    bucket: ""

    # AWS region, or the region your S3-compatible provider expects.
    # Required when s3.enabled=true.
    region: ""

    # Custom S3 endpoint for S3-compatible providers (MinIO, R2, Backblaze
    # B2, etc.). Leave empty ("") to use AWS S3's default endpoint for the
    # configured region.
    endpoint: ""

    # Use path-style addressing (https://endpoint/bucket/key) instead of
    # virtual-hosted-style (https://bucket.endpoint/key). Most self-hosted
    # S3-compatible providers (e.g. MinIO) require this; leave false for AWS
    # S3.
    forcePathStyle: false

    # Name of a pre-existing Kubernetes Secret containing the S3 credentials.
    # Preferred over the inline accessKeyId/secretAccessKey below (keeps
    # credentials out of `helm get values` / release history). When set, the
    # inline credential values are ignored and no chart-managed Secret is
    # created for S3 credentials.
    existingSecret: ""
    # Key within existingSecret holding the access key ID.
    existingSecretAccessKeyIdKey: "S3_ACCESS_KEY_ID"
    # Key within existingSecret holding the secret access key.
    existingSecretSecretAccessKeyKey: "S3_SECRET_ACCESS_KEY"

    # Inline credentials, used only when existingSecret is empty. Rendered
    # into a chart-managed Secret (<release>-s3-secret) the same way
    # secrets.jwtSecret etc. are rendered into <release>-secrets.
    accessKeyId: ""
    secretAccessKey: ""

# ============================================
# Replay Segments Storage Configuration
# ============================================
# Storage for LiveKit egress replay segments
# This directory is shared between LiveKit egress pods and the backend
replayStorage:
  # Enable replay segments storage
  # Set to false to disable replay buffer features
  enabled: false

  # Storage size for replay segments
  size: 50Gi

  # Mount path in the backend container
  # This should match the REPLAY_SEGMENTS_PATH environment variable
  mountPath: "/app/replay-segments"

  # NFS-specific configuration for shared storage
  # Required when using multiple backend replicas or external LiveKit egress
  nfs:
    enabled: false
    # NFS server IP or hostname
    server: "nfs-server.example.com"
    # NFS export path for replay segments
    path: "/exports/semaphore-replay-segments"
