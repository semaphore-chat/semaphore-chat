# Host-fallback overlay for voice E2E — ONLY needed when running Playwright on
# the HOST (e.g. `--headed` debugging). Publishes LiveKit's signaling + ICE
# ports so a host browser can reach it at ws://localhost:7882, and pins
# node_ip: 127.0.0.1 so the advertised ICE candidates point at the host's
# published ports.
#
# Usage:
#   scripts/test-net.sh   # the shared semaphore-test network (external)
#   docker compose -f docker-compose.e2e.yml \
#     -f docker-compose.voice-e2e.yml \
#     -f docker-compose.voice-e2e.host.yml up -d ...
#   (then run Playwright on the host with E2E_BASE_URL=http://localhost:5174)
#
# Signaling/TCP ports chosen to avoid the dev stack (7880-7882) and e2e stack
# (5433/6380/3001/5174). The ICE UDP range (50000-50019) is published 1:1 so the
# advertised candidate ports match the host-mapped ports. These fixed host
# ports mean only one host-browser voice stack can run at a time.

services:
  livekit-e2e:
    environment:
      # NOTE: LIVEKIT_CONFIG is duplicated (with deliberate differences) in docker-compose.yml and docker-compose.voice-e2e.yml — keep keys/ports in sync when editing.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50019
          use_external_ip: false
          node_ip: 127.0.0.1
        redis:
          address: ${E2E_STACK:-semaphore-e2e}-redis:6379
        keys:
          devkey: secret-that-is-at-least-32-characters-long
    ports:
      - "7882:7880"          # client ws (signaling)
      - "7883:7881"          # rtc tcp
      - "50000-50019:50000-50019/udp"  # rtc ICE udp range (1:1 mapping)

  # When the browser runs on the host, the LiveKit URL the app receives must be
  # the host-published signaling port.
  backend-test:
    environment:
      - LIVEKIT_URL=ws://localhost:7882
