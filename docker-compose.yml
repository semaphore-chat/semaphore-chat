services:
  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: pnpm exec prisma migrate deploy --schema=prisma/schema.prisma
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: pnpm run start:dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - LIVEKIT_URL=ws://localhost:7880
      - LIVEKIT_INTERNAL_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret-that-is-at-least-32-characters-long
      - REPLAY_SEGMENTS_PATH=/app/storage/replay-segments
      - REPLAY_EGRESS_OUTPUT_PATH=/out
      - ADMIN_DEBUG_PANEL=true
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
      - /app/shared/node_modules
      - egress-data:/app/storage/replay-segments
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
      - ./backend:/spec:ro
    working_dir: /app/frontend
    depends_on:
      - backend
      - redis

  # UX sandbox: renders real app screens/components against fake (MSW) data —
  # no backend, no LiveKit, no database. See docs/superpowers/specs/2026-09-22-ladle-ux-sandbox-design.md
  # and frontend/README.md. Opt-in via profile:
  #   docker compose --profile tools up -d ladle
  # then open http://localhost:61000
  ladle:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    profiles: ["tools"]
    command: pnpm exec ladle serve --host 0.0.0.0
    ports:
      - "61000:61000"
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
      - ./backend:/spec:ro
    working_dir: /app/frontend

  # Automated screenshot sweep of every Ladle story at phone/tablet/desktop
  # viewports. Run after `ladle` is up:
  #   docker compose --profile tools run --rm ux-shots
  # Output: frontend/.ux-shots/<viewport>/<story-id>.png + report.json (gitignored).
  # Uses the Microsoft Playwright image (browsers pre-installed, pinned to
  # the same 1.60.0 release as the frontend's `@playwright/test` devDependency)
  # and installs the lightweight `playwright-core` driver package on start
  # since this image doesn't ship the npm package itself. Installed into
  # /opt/uxshots (NOT frontend/, which is a pnpm workspace member — plain
  # `npm install` chokes on its `workspace:*` dependency); ux-shots.mjs picks
  # it up via NODE_PATH + `require()`.
  ux-shots:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    profiles: ["tools"]
    working_dir: /app/frontend
    # Share `ladle`'s network namespace instead of talking to it over the
    # bridge network as `http://ladle:61000`: `navigator.mediaDevices`
    # (device enumeration, used by voice/video settings screens) only
    # exists in a "secure context" — HTTPS, or the browser-special-cased
    # hostname "localhost" — and a custom docker-compose service hostname
    # doesn't qualify. Requires `ladle` to already be running.
    network_mode: "service:ladle"
    volumes:
      - ./frontend:/app/frontend
    environment:
      - UX_SHOTS_BASE_URL=http://localhost:61000
      - UX_SHOTS_FILTER
      - UX_SHOTS_VIEWPORTS
      - NODE_PATH=/opt/uxshots/node_modules
    command: >
      sh -c "mkdir -p /opt/uxshots && cd /opt/uxshots && npm init -y --silent >/dev/null &&
      npm install --silent --no-audit --no-fund playwright-core@1.60.0 &&
      cd /app/frontend && node scripts/ux-shots.mjs"

  # NOTE: near-duplicate of the postgres service in docker-compose.prod.yml and docker-compose.e2e.yml — keep image/healthcheck/env keys in sync.
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: semaphore
      POSTGRES_DB: semaphore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaphore"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # NOTE: near-duplicate of the redis service in docker-compose.prod.yml and docker-compose.e2e.yml — keep image/healthcheck/env keys in sync.
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
    volumes:
      - "redisdata:/data"

  livekit:
    image: livekit/livekit-server:latest
    environment:
      # NOTE: LIVEKIT_CONFIG is duplicated (with deliberate differences) in docker-compose.voice-e2e.yml and docker-compose.voice-e2e.host.yml — keep keys/ports in sync when editing.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 127.0.0.1
        redis:
          address: redis:6379
        keys:
          devkey: secret-that-is-at-least-32-characters-long
        webhook:
          api_key: devkey
          urls:
            - http://backend:3000/api/livekit/webhook
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  # S3-compatible object storage for local dev/testing of STORAGE_TYPE=S3.
  # Opt-in via profile — doesn't start with a plain `docker compose up`:
  #   docker compose --profile s3 up -d minio minio-init
  # (minio-init creates the dev bucket automatically — see that service below.)
  # Then set in backend/.env: STORAGE_TYPE=S3, S3_BUCKET=semaphore-dev,
  # S3_REGION=us-east-1, S3_ACCESS_KEY_ID=minioadmin,
  # S3_SECRET_ACCESS_KEY=minioadmin, S3_ENDPOINT=http://minio:9000,
  # S3_FORCE_PATH_STYLE=true. See docs-site/docs/installation/configuration.md.
  #
  # Image pinned to a specific release (not `:latest`) for reproducible dev
  # behavior. CI intentionally uses `minio/minio:edge-cicd` instead — a
  # separate constraint from a bare GitHub Actions service container boot
  # (no compose profile, no healthcheck-gated init sidecar) — so the two are
  # deliberately not kept identical.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      # - "9001:9001" # Web console — uncomment to browse buckets at http://localhost:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - miniodata:/data

  # One-shot sidecar: creates the dev bucket so the backend doesn't have to.
  # Equivalent manual command if you ever need to re-run it by hand:
  #   docker compose --profile s3 run --rm minio-init
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["s3"]
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/semaphore-dev
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  egress-init:
    image: busybox
    volumes:
      - egress-data:/out
    command: chown -R 1001:0 /out
    restart: "no"

  livekit-egress:
    image: livekit/egress:latest
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret-that-is-at-least-32-characters-long
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
    volumes:
      - egress-data:/out
    depends_on:
      egress-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  egress-data:
  miniodata:
