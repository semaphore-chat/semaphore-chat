# Everything here is a build input of native/scripts/android.sh, which sets the caches and HOME
# (Gradle's cache, the debug keystore) to Docker volumes outside the checkout.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
