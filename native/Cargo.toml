[workspace]
resolver = "3"
members = ["crates/*", "rigs/shot", "rigs/list"]
# Fallback-framework rigs keep their own lockfile so Iced's dependency tree never
# unifies with GPUI's. Nothing lives there in Phase 0.
exclude = ["rigs/video-iced", "third_party", "tools"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
semaphore-api = { path = "crates/semaphore-api" }
semaphore-core = { path = "crates/semaphore-core" }
semaphore-design = { path = "crates/semaphore-design" }
semaphore-media-livekit = { path = "crates/semaphore-media-livekit" }
semaphore-net = { path = "crates/semaphore-net" }
semaphore-platform-desktop = { path = "crates/semaphore-platform-desktop" }
semaphore-ui = { path = "crates/semaphore-ui" }
semaphore-wire = { path = "crates/semaphore-wire" }

# UI. gpui-kit pins `gpui-pre =0.3.11` itself, so this one exact version (plus the
# committed Cargo.lock) fixes GPUI too. Never add Zed's git gpui next to it: that is
# a second, incompatible GPUI. A renderer fork goes through [patch.crates-io].
gpui-kit = "=0.9.0"

# Media.
livekit = { version = "=0.10.1", features = ["rustls-tls-native-roots"] }

# Everything else.
anyhow = "1"
async-trait = "0.1"
directories = "6"
# 0.13 because that is what progenitor-client 0.15 needs. No TLS here: semaphore-api
# sends JSON over whatever client it is given, and semaphore-net picks the backend.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# The NV12 video surface. Built from crates.io source and our patches: see third_party/README.md.
[patch.crates-io]
gpui-pre = { path = "third_party/vendor/gpui-pre" }
gpui-pre-wgpu = { path = "third_party/vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "third_party/vendor/gpui-pre-windows" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "symbols"
lto = "thin"
