[package]
name = "semaphore-app"
description = "The desktop binary: wires core, desktop services and the UI together."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "semaphore-app"
path = "src/main.rs"

[dependencies]
async-channel = "2"
futures-util.workspace = true
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { workspace = true, features = ["stream"] }
rustls = { version = "0.23", default-features = false }
gpui-kit.workspace = true
log.workspace = true
semaphore-core.workspace = true
semaphore-media-livekit.workspace = true
semaphore-net.workspace = true
semaphore-platform-desktop.workspace = true
semaphore-sysaudio.workspace = true
semaphore-ui.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread"] }
