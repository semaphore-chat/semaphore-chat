[package]
name = "semaphore-net"
description = "HTTP and WebSocket transport. Pulls in ring through rustls, so unlike core it needs a C toolchain per target."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# reqwest 0.13 has no webpki-roots feature any more: `rustls` pulls aws-lc-rs, and
# `rustls-no-provider` leaves the choice to us. We pick ring, which the graph already
# builds, and install it in `install_crypto_provider`.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# REST and the socket share one rustls config over this, so they trust the same roots: the OS's.
rustls-platform-verifier = "0.7"
async-trait.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde_json.workspace = true
tokio-tungstenite.workspace = true
semaphore-core.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
semaphore-api.workspace = true
semaphore-wire.workspace = true
uuid = { version = "1", features = ["v4"] }
log.workspace = true

[dev-dependencies]
semaphore-fake-server = { path = "../semaphore-fake-server" }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
