[package]
name = "semaphore-net"
description = "HTTP and WebSocket transport. Pulls in ring through rustls, so unlike core it needs a C toolchain per target."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# reqwest 0.13 has no webpki-roots feature any more: `rustls` pulls aws-lc-rs, and
# `rustls-no-provider` leaves the choice to us. We pick ring, which the graph already
# builds, and install it in `install_crypto_provider`.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite.workspace = true
semaphore-core.workspace = true
tokio = { workspace = true, features = ["net"] }
