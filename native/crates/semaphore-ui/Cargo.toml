[package]
name = "semaphore-ui"
description = "GPUI views over semaphore-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit.workspace = true
# Builds RenderImage frames: fixture emoji and images, and the RGBA video fallback.
image = { version = "0.25", default-features = false }
semaphore-core.workspace = true
semaphore-design.workspace = true
# Reads the emoji picker's data (`assets/emoji/emoji.json`, exported from the web client).
serde_json.workspace = true
unicode-segmentation = "1"

# `mallopt`, for the allocator setting T2 found the list needs. See `messages::media`.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
semaphore-core = { workspace = true, features = ["fixtures"] }

[features]
# The story registry and scenario fixtures. The app never turns this on.
stories = ["semaphore-core/fixtures"]
