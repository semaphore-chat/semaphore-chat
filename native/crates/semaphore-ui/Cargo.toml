[package]
name = "semaphore-ui"
description = "GPUI views over semaphore-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
# Only to build RenderImage frames for the RGBA video fallback.
image = { version = "0.25", default-features = false }
semaphore-core.workspace = true

[features]
# The story registry and scenario fixtures. The app never turns this on.
stories = ["semaphore-core/fixtures"]
