[package]
name = "semaphore-ui"
description = "GPUI views over semaphore-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
# Only for building fixture images in memory: `RenderImage` is made of `image::Frame`s.
image = { version = "0.25", default-features = false, optional = true }
semaphore-core.workspace = true
semaphore-design.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
# The story registry and scenario fixtures. The app never turns this on.
stories = ["semaphore-core/fixtures", "dep:image"]
