[package]
name = "semaphore-ui"
description = "GPUI views over semaphore-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
# Builds RenderImage frames: fixture emoji and images, and the RGBA video fallback.
image = { version = "0.25", default-features = false }
# The display clock and the zone every date is written in: `TimeZone::system()` is the user's,
# from the OS tz database (bundled on Windows, which has none in that form, as in core).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }
semaphore-core.workspace = true
semaphore-design.workspace = true
# Reads the emoji picker's data (`assets/emoji/emoji.json`, exported from the web client).
serde_json.workspace = true
unicode-segmentation = "1"

# `mallopt`, for the allocator setting T2 found the list needs. See `messages::media`.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
semaphore-core = { workspace = true, features = ["fixtures"] }

[features]
# The story registry and scenario fixtures. The app never turns this on.
stories = ["semaphore-core/fixtures"]
