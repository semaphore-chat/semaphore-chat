[package]
name = "semaphore-ui"
description = "GPUI views over semaphore-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
gpui-kit.workspace = true
# Only for building fixture emoji and images in memory: `RenderImage` is made of `image::Frame`s.
image = { version = "0.25", default-features = false, optional = true }
semaphore-core.workspace = true
unicode-segmentation = "1"

# `mallopt`, for the allocator setting T2 found the list needs. See `messages::media`.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
image = { version = "0.25", default-features = false }
semaphore-core = { workspace = true, features = ["fixtures"] }
serde_json.workspace = true

[features]
# The story registry and scenario fixtures. The app never turns this on.
stories = ["semaphore-core/fixtures", "dep:image"]
