[package]
name = "semaphore-player"
description = "Video and audio attachment playback with the FFmpeg, libvpx and dav1d inside LiveKit's prebuilt libwebrtc (docs/player.md). Desktop only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# AAC decoding is on in every shipped build (the owner's decision; docs/player.md). The decoder
# ships in the binary either way (libwebrtc's H.264 decoder links FFmpeg's whole decoder list);
# without this feature the player refuses AAC streams, which is how the refusal paths are tested:
# `cargo test -p semaphore-player --no-default-features`. Only AAC-LC decodes either way.
default = ["aac"]
aac = []

[dependencies]
log.workspace = true
rtrb = "0.3"
semaphore-core.workspace = true
# The audio output seam (AudioIo) and its 48 kHz rate. Already in the app; the player adds no
# second audio stack.
semaphore-media-livekit.workspace = true
# The authenticated client for range reads (src/range.rs).
semaphore-net.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
# Only to link libwebrtc.a, where every symbol the shim calls lives. No features, so it never
# changes what the app's webrtc-sys builds with.
webrtc-sys = { version = "0.3.53", default-features = false }

[dev-dependencies]
semaphore-fake-server = { path = "../semaphore-fake-server" }
semaphore-wire.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[build-dependencies]
cc = "1"
webrtc-sys-build = "=0.3.21"
