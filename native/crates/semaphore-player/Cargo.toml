[package]
name = "semaphore-player"
description = "Video and audio attachment playback with the FFmpeg, libvpx and dav1d inside LiveKit's prebuilt libwebrtc (docs/player.md). Desktop only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The AAC decoder ships in the binary either way (libwebrtc's H.264 decoder links FFmpeg's whole
# decoder list); without this the player refuses AAC streams. Patent posture: docs/player.md.
aac = []

[dependencies]
# Only to link libwebrtc.a, where every symbol the shim calls lives. No features, so it never
# changes what the app's webrtc-sys builds with.
webrtc-sys = { version = "0.3.53", default-features = false }

[build-dependencies]
cc = "1"
webrtc-sys-build = "=0.3.21"
