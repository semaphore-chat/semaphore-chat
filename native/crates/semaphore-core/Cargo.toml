[package]
name = "semaphore-core"
description = "UI-free, OS-free client core. Must stay checkable on iOS and Android with no C toolchain."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `scenario`: turns the exported Ladle scenarios into view models, for stories.
fixtures = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# Inline, not workspace, for the same reason as chrono below.
proptest = "1.12"

# Keep [dependencies] last: scripts/test-policy.sh appends a dependency line to this file.
# Rule, enforced by scripts/check-core-boundary.py: no UI crate, no desktop-only crate,
# nothing that compiles C or links a native library. OS services and media are traits
# in src/platform.rs, implemented in other crates.
[dependencies]
async-trait.workspace = true
# Inline, not workspace, because scripts/test-policy.sh copies this crate into its own workspace.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# DND windows in the user's timezone. Reads the system tz database on Linux, macOS, Android and
# iOS; on Windows, which has none in that form, jiff bundles one (`tzdb-bundle-platform`).
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }
log = "0.4"
semaphore-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
# Sign in with browser: the PKCE verifier and `state` from the OS's random source, and the S256
# challenge. Both pure Rust. Inline for scripts/test-policy.sh, as chrono above.
getrandom = "0.4"
sha2 = { version = "0.10", default-features = false }
# Notification previews cut between graphemes, not code points. Pure Rust, no C.
unicode-segmentation = "1"
