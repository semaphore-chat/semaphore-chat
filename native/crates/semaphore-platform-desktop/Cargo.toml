[package]
name = "semaphore-platform-desktop"
description = "Desktop implementations of core's OS-service traits."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
directories.workspace = true
log.workspace = true
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
png = "0.18"
semaphore-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# The sign-in-with-browser listener (`loopback`). Not zbus: see the Linux section below.
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }

# logind, NetworkManager, notifications and the tray. async-io only, never `tokio`: see src/lifecycle.rs.
[target.'cfg(target_os = "linux")'.dependencies]
# The notifier's command queue, read on its async-io thread.
async-channel = "2"
futures-util.workspace = true
# The tray, as a StatusNotifierItem (Unlicense). async-io like zbus here, never tokio.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The taskbar overlay is a COM interface, which windows-sys doesn't bind. The version
# gpui-pre-windows already pulls, so only features are added.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "time"] }
