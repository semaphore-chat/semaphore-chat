[package]
name = "semaphore-ffi"
description = "Proves semaphore-core stays binding-friendly: a UniFFI surface that must keep compiling."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
semaphore-core.workspace = true
uniffi = "0.32"

[target.'cfg(target_os = "android")'.dependencies]
# Android only: `MainActivity` calls the JNI entry point below, which initialises
# rustls-platform-verifier through semaphore-net. Desktop builds of this crate stay core-only.
semaphore-net.workspace = true
jni = { version = "0.22", default-features = false }
