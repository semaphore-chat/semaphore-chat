[package]
name = "semaphore-ffi"
description = "The UniFFI surface over semaphore-core, for the mobile apps."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
semaphore-core.workspace = true
# The host's runtime handle only: no runtime of its own and no C (`rt` is pure Rust).
tokio = { workspace = true, features = ["rt"] }
uniffi = "0.32"
