[package]
name = "rig-slice"
description = "U13: drives the real app headless against the fake server, with screenshots and state checks."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# W3-player-wire: the app with its inline attachment players (scripts/w3-player-wire.steps).
player = ["semaphore-app/player"]

[dependencies]
anyhow.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
log.workspace = true
rig-shot = { path = "../shot" }
semaphore-app = { path = "../../crates/semaphore-app" }
semaphore-core.workspace = true
semaphore-fake-server = { path = "../../crates/semaphore-fake-server" }
semaphore-media-livekit.workspace = true
semaphore-ui.workspace = true
serde_json.workspace = true
# `core revoke-other-sessions` runs the command on a runtime of its own while the rig waits.
tokio = { workspace = true, features = ["rt", "net", "time"] }

[dev-dependencies]
async-channel = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
